name: Fix Release APK Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-release-apk-once.yml'

permissions:
  contents: write

jobs:
  fix-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android-app/**/*.gradle*'

      - name: Fix release artifact task graph
        run: python3 .github/scripts/fix_release_apk.py

      - name: Validate formatting
        run: git diff --check

      - name: Compile Android Kotlin
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Validate release task graph
        working-directory: android-app
        run: ./gradlew :app:renameReleaseApk --dry-run --no-daemon

      - name: Commit fix
        shell: bash
        run: |
          git checkout -- android-app/version.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/build.gradle.kts
          git commit -m "Fix release APK artifact task graph"
          git push origin HEAD:main
