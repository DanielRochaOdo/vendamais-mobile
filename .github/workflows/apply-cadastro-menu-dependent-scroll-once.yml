name: Apply Cadastro Menu And Dependent Scroll Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-cadastro-menu-dependent-scroll-once.yml'

permissions:
  contents: write

jobs:
  apply-ui-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android-app/**/*.gradle*'

      - name: Apply UI changes
        run: python3 .github/scripts/apply_ui_menu_scroll.py

      - name: Validate patch
        run: git diff --check

      - name: Compile Android Kotlin
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit UI fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/CadastrosScreen.kt
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/InclusaoDependenteDialog.kt
          git commit -m "Refine cadastro menu and dependent search scroll"
          git push origin HEAD:main
