name: Validate Edge Functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/validate-deno-parity.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/validate-deno-parity.yml'
  workflow_dispatch:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        run: |
          mapfile -t files < <(find supabase/functions -name 'index.ts' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Edge Functions found."
            exit 0
          fi
          deno check --node-modules-dir=auto "${files[@]}"
