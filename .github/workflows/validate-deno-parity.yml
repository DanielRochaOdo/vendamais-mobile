name: Validate Edge Functions

on:
  pull_request:
    paths:
      - 'supabase/functions/update-user/**'
      - 'supabase/functions/cadastro-link-resolve/**'
      - 'supabase/functions/cadastro-link-check-cpf/**'
      - '.github/workflows/validate-deno-parity.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/update-user/**'
      - 'supabase/functions/cadastro-link-resolve/**'
      - 'supabase/functions/cadastro-link-check-cpf/**'
      - '.github/workflows/validate-deno-parity.yml'
  workflow_dispatch:

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check parity Edge Functions
        run: |
          deno check --node-modules-dir=auto \
            supabase/functions/update-user/index.ts \
            supabase/functions/cadastro-link-resolve/index.ts \
            supabase/functions/cadastro-link-check-cpf/index.ts
