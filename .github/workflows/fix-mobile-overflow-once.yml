name: Fix Mobile Overflow Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-mobile-overflow-once.yml'

permissions:
  contents: write

jobs:
  fix-overflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android-app/**/*.gradle*'

      - name: Apply responsive layout fixes
        run: |
          python3 .github/scripts/fix_mobile_overflow.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-app/app/src/main/java/br/com/vendamais/mobile/ui/components/OperationalComponents.kt')
          text = path.read_text()
          if 'import androidx.compose.foundation.horizontalScroll' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.clickable\n',
                  'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.rememberScrollState\n',
                  1,
              )
          if 'import androidx.compose.foundation.layout.widthIn' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.layout.size\n',
                  'import androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.layout.widthIn\n',
                  1,
              )
          path.write_text(text)
          PY

      - name: Validate patch formatting
        run: git diff --check

      - name: Compile Android Kotlin
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Commit responsive fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/components/OperationalComponents.kt
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/components/WebComponents.kt
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/CadastrosScreen.kt
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/AdesoesExcluidasScreen.kt
          git commit -m "Harden mobile layouts against text overflow"
          git pull --rebase origin main
          git push origin HEAD:main
