name: Apply cadastro performance hotfix

on:
  push:
    branches:
      - agent/performance-cadastro-flow
    paths:
      - 'scripts/apply_performance_cadastro_hotfix.py'
      - 'patches/performance-cadastro-flow.patch'
      - '.github/workflows/apply-performance-cadastro-flow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/performance-cadastro-flow
          fetch-depth: 0

      - name: Detect applicator
        id: detect
        shell: bash
        run: |
          if [ -f scripts/apply_performance_cadastro_hotfix.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.detect.outputs.apply == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Set up Deno
        if: steps.detect.outputs.apply == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply performance changes
        if: steps.detect.outputs.apply == 'true'
        run: python3 scripts/apply_performance_cadastro_hotfix.py

      - name: Compile Android Kotlin
        if: steps.detect.outputs.apply == 'true'
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon

      - name: Check Lemmit Edge Function
        if: steps.detect.outputs.apply == 'true'
        run: deno check supabase/functions/lemit-consulta-pessoa/index.ts

      - name: Commit validated hotfix
        if: steps.detect.outputs.apply == 'true'
        run: |
          rm -f patches/performance-cadastro-flow.patch
          rm -f scripts/apply_performance_cadastro_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Otimiza desempenho do fluxo de nova adesao"
          git push origin HEAD:agent/performance-cadastro-flow
