name: Apply cadastro performance hotfix

on:
  push:
    branches:
      - agent/performance-cadastro-flow
    paths:
      - 'patches/performance-cadastro-flow.patch'
      - '.github/workflows/apply-performance-cadastro-flow.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/performance-cadastro-flow
          fetch-depth: 0

      - name: Validate patch
        run: git apply --check patches/performance-cadastro-flow.patch

      - name: Apply patch
        run: git apply patches/performance-cadastro-flow.patch

      - name: Commit hotfix
        run: |
          rm patches/performance-cadastro-flow.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Otimiza desempenho do fluxo de nova adesao"
          git push origin HEAD:agent/performance-cadastro-flow
