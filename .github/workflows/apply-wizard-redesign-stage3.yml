name: Apply Wizard Redesign Stage 3
on:
  push:
    branches: [agent/stitch-redesign-wizards]
    paths:
      - 'scripts/apply_wizard_redesign_stage3.py'
      - '.github/workflows/apply-wizard-redesign-stage3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stitch-redesign-wizards
      - name: Apply wizard redesign
        run: python scripts/apply_wizard_redesign_stage3.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android Kotlin
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon
      - name: Commit validated redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/CadastroEditorDialog.kt android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/InclusaoDependenteDialog.kt android-app/app/src/main/java/br/com/vendamais/mobile/ui/screens/PublicAdesaoParityScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Redesenha wizards de adesao"
            git push origin HEAD:agent/stitch-redesign-wizards
          fi
