name: Apply Adesart Parity

on:
  push:
    branches:
      - agent/adesart-parity
    paths:
      - '.github/scripts/apply_adesart_parity.py'
      - '.github/scripts/apply_adesart_parity_stage2_pre.py'
      - '.github/scripts/apply_adesart_parity_stage2.py'
      - '.github/scripts/apply_adesart_parity_stage2_post.py'
      - '.github/scripts/apply_adesart_parity_stage3.py'
      - '.github/workflows/apply-adesart-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/adesart-parity
          fetch-depth: 0

      - name: Apply parity patches
        run: |
          python3 .github/scripts/apply_adesart_parity.py
          python3 .github/scripts/apply_adesart_parity_stage2_pre.py
          python3 .github/scripts/apply_adesart_parity_stage2.py
          python3 .github/scripts/apply_adesart_parity_stage2_post.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android-app/**/*.gradle*

      - name: Compile Android Kotlin
        working-directory: android-app
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee ../parity-gradle.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E '(^e: | error: |Unresolved reference|Type mismatch|Cannot infer|FAILURE:|Compilation error)' ../parity-gradle.txt | tail -n 200 > ../.github/parity-compile-errors.txt || true
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f .github/parity-compile-errors.txt
            git commit -m "Registra erros de compilacao da paridade" || true
            git push origin HEAD:agent/adesart-parity || true
            exit "$status"
          fi

      - name: Commit generated parity changes
        run: |
          rm -f .github/parity-compile-errors.txt parity-gradle.txt
          if git diff --quiet; then
            echo "No parity changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app
          git add -u .github/parity-compile-errors.txt || true
          git commit -m "Completa paridade administrativa com Adesart"
          git push origin HEAD:agent/adesart-parity
